version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ferntrail-bitgarth_web_1
      APP_PORT: 8080

  web:
    image: bitgarth/bitgarth:0.1.9@sha256:3ff04e7343bf75ea46fbcb0b7da040b093ebe22fff2ec6dcaa87d745616fd21c
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      BITGARTH_CHANNEL: umbrel
