releaseNotes: |
  The new Holdings Report shows how every wallet moved over a date range you
  choose: opening value, closing value, and total change in one view.

  New:

  - Open the Holdings Report from the Reports section to compare wallet values
  - Name accounts when adding xpubs, Bitcoin addresses, Ethereum addresses, or manual assets
  - Set an account prefix in the hledger export settings before exporting
  - Add a price override on the free tier when a report is missing a price

  Fixes:

  - Historical price lookups are steadier over daily ranges and back off when providers ask BitGarth to slow down
  - Long sync error messages stay readable, and each sync row opens straight to its record
  - Holdings Report totals include manual assets alongside synced wallets

  Notes:

  - On the free tier the Holdings Report always covers a rolling nine-month window

  Full release notes at https://bitgarth.app/releases.html#0.1.9
