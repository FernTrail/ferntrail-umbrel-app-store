releaseNotes: |
  Self-hosted installs now hold to the correct free-tier limits on their own:
  refreshing when they can reach our servers, and keeping the last known limits
  when they can't.

  New:

  - Free-tier limits stay accurate on self-hosted installs without a constant connection
  - Manual accounts can now use assets BitGarth already tracks in synced wallets, including Bitcoin and Ethereum
  - Umbrel users get in-app update notices pointing to the Umbrel app store
  - Hosted free users are told how inactive data is retained and removed

  Fixes:

  - Missing pages return a proper "not found" response
  - Manual asset search keeps its original ordering and result counts
  - Wallet rows no longer show confusing account-usage text

  Notes:

  - The free tier now allows 50 accounts
  - Balance assertions and hledger export are included on Free; full transaction-history sync stays paid

  Full release notes at https://bitgarth.app/releases.html#0.1.8
