releaseNotes: |
  Account pages now open with an identity strip that shows what they track,
  and upgrading starts transaction-history sync straight away with live
  progress. The Payments page keeps your current plan visible while plan data
  loads or is unavailable.

  New:

  - Expand the account identity strip to copy the full reference or see its addresses
  - Tell same-xpub accounts apart by address type and shortened reference
  - Read plain-language plan summaries, with the free tier shown as $0 free
  - Reach BitGarth by email or PGP public key from the sidebar
  - Get a clear result every time you press the sync button

  Fixes:

  - Empty transaction history shows no invented opening balance
  - Sync status settles correctly after an upgrade
  - Wallets and transactions show the same sync mark for an account

  Full release notes at https://bitgarth.app/releases.html#0.2.0
submitter: FernTrail B.V.
